name: release
# A tag `vX.Y.Z` publishes that version to PyPI and attaches the three desktop installers to its GitHub
# release. The release is created as a draft, each installer leg uploads to the draft, and only when all
# three legs succeeded does the last job publish it: a leg that fails leaves a draft nobody sees, never a
# public release with an installer missing.
#
# Run by hand (Actions -> release -> Run workflow), it is a rehearsal that publishes nothing: it builds
# and checks the package and builds the three desktop installers, kept only as downloadable workflow
# artifacts (dist, installer-windows, installer-macOS, installer-linux). It touches no GitHub release and
# no PyPI, even when started from a tag. Ticking the `testpypi` box on that run also uploads the package
# to TestPyPI; it is off unless ticked.
#
# Publishing uses PyPI's Trusted Publishing (OIDC): no token is stored anywhere. Each index has to be
# told once to trust this repository's `release.yml` and the environment named below.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Also upload the package to TestPyPI"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(python3 -c "import re,sys; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/f3d2solidcraft/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not version $version"; exit 1; }
      - run: uv build
      - name: Metadata
        run: uvx twine check --strict dist/*
      - name: The wheel installs and runs on its own
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/f3d2solidcraft --help
          /tmp/smoke/bin/f3d2solidcraft --version
          /tmp/smoke/bin/python -c "import f3d2solidcraft; print(f3d2solidcraft.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi  # a manual run publishes nothing unless asked
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')  # a dispatch, even from a tag, never publishes
    # Last, after the GitHub release is out with all three installers: PyPI cannot be undone, so it
    # waits until nothing else can still fail and leave PyPI ahead of the installers.
    needs: [build, publish]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The desktop app, packaged by Briefcase on each system, attached to the tag's GitHub release. Briefcase
  # is pinned to the version these steps were measured with. Each leg puts a cadmpeg checked against its
  # pinned sha256 inside the app first (on macOS a universal one, joined with `lipo`).
  #
  # Linux, measured in an ubuntu:22.04 x86_64 container (the runner below): Briefcase 0.4.7's AppImage
  # template (branch v0.4.7, also v0.4.5 and v0.4.6) renders `cookiecutter.host_arch` without declaring
  # it in its cookiecutter.json, so cookiecutter drops the value Briefcase passes and `create` stops on
  # "'collections.OrderedDict object' has no attribute 'host_arch'". The v0.4.4 template predates that
  # line; with it the AppImage builds, and it opens, answers `--check` and runs `--worker` on ubuntu
  # 22.04 and 24.04. `--no-docker` builds on the runner itself: PySide6 6.12 ships only manylinux_2_34
  # wheels, which ubuntu 22.04 (glibc 2.35) installs, so a Docker manylinux image would not make the
  # AppImage reach older systems anyway. The apt step gives linuxdeploy the libraries Qt links against,
  # so it can copy into the AppImage the ones a desktop may lack: without libxcb-cursor0 (and the three
  # xcb libraries linuxdeploy stops on before it, icccm, keysyms and shape) on the build machine, the
  # AppImage measured under Xvfb on a fresh ubuntu 22.04 aborted with "From 6.5.0, xcb-cursor0 or
  # libxcb-cursor0 is needed to load the Qt xcb platform plugin".
  #
  # Run by hand, this job is the installers' rehearsal: it builds them and uploads them as workflow
  # artifacts, and the release steps are skipped. A tag does both.
  installers:
    # `!cancelled()` so a hand run, where `draft` is skipped, still builds; the result checks keep a
    # failed build or a draft that was not made from going on.
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.draft.result == 'success' || needs.draft.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    needs: [build, draft]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            format: ""
            flags: ""
          - os: macos-latest
            platform: macOS
            format: ""
            flags: ""
          - os: ubuntu-22.04
            platform: linux
            format: appimage
            flags: --no-docker -C 'template_branch="v0.4.4"'
    # `write` is only used by the upload to the draft, which runs on tags alone. A job's permissions cannot
    # depend on the event, so a hand run gets it too; it uploads artifacts and nothing else.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: What Qt links against, for linuxdeploy to find
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libgl1 libfontconfig1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: uv run --no-project python scripts/fetch_cadmpeg.py
      - run: uvx briefcase==0.4.7 create ${{ matrix.platform }} ${{ matrix.format }} ${{ matrix.flags }} --no-input
      - run: uvx briefcase==0.4.7 build ${{ matrix.platform }} ${{ matrix.format }} ${{ matrix.flags }} --no-input
      - run: uvx briefcase==0.4.7 package ${{ matrix.platform }} ${{ matrix.format }} ${{ matrix.flags }} ${{ matrix.platform == 'macOS' && '--adhoc-sign' || '' }} --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - name: Upload to the draft release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # The tag's release, as a draft, before any installer is built: the three legs upload into this one
  # release instead of racing to create it. A draft left from an earlier attempt at the same tag is used
  # as it is; a release already published is not turned back into a draft.
  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; the legs upload to it"
            exit 0
          fi
          # The notes are the version's own section of CHANGELOG.md, from its heading to the next one.
          awk -v v="## ${GITHUB_REF_NAME#v}" '
            index($0, v) == 1 && (length($0) == length(v) || substr($0, length(v) + 1, 1) == " ") { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file notes.md

  # Publishes the draft once every installer leg succeeded. A failed or cancelled leg skips this job, so
  # the release stays a draft with whatever was uploaded, for a re-run of the failed leg to complete.
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [draft, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Every installer is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          echo "$assets"
          for suffix in .msi .dmg .AppImage; do
            grep -q -- "$suffix\$" <<< "$assets" || { echo "no $suffix attached to $GITHUB_REF_NAME"; exit 1; }
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
