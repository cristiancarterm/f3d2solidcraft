name: release
# A tag `vX.Y.Z` publishes that version to PyPI and attaches the three desktop installers to its GitHub
# release.
#
# Run by hand (Actions -> release -> Run workflow), it is a rehearsal that publishes nothing: it builds
# and checks the package and builds the three desktop installers, kept only as downloadable workflow
# artifacts (dist, installer-windows, installer-macOS, installer-linux). It touches no GitHub release and
# no PyPI, even when started from a tag. Ticking the `testpypi` box on that run also uploads the package
# to TestPyPI; it is off unless ticked.
#
# Publishing uses PyPI's Trusted Publishing (OIDC): no token is stored anywhere. Each index has to be
# told once to trust this repository's `release.yml` and the environment named below.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Also upload the package to TestPyPI"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: The tag is the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          version=$(python3 -c "import re,sys; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/f3d2solidcraft/__init__.py').read()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not version $version"; exit 1; }
      - run: uv build
      - name: Metadata
        run: uvx twine check --strict dist/*
      - name: The wheel installs and runs on its own
        run: |
          set -euo pipefail
          uv venv /tmp/smoke
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
          /tmp/smoke/bin/f3d2solidcraft --help
          /tmp/smoke/bin/python -c "import f3d2solidcraft; print(f3d2solidcraft.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi  # a manual run publishes nothing unless asked
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')  # a dispatch, even from a tag, never publishes
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The desktop app, packaged by Briefcase on each system, attached to the tag's GitHub release. Briefcase
  # is pinned to the version these steps were measured with. Each leg puts a cadmpeg checked against its
  # pinned sha256 inside the app first (on macOS a universal one, joined with `lipo`).
  #
  # Linux, measured in an ubuntu:22.04 x86_64 container (the runner below): Briefcase 0.4.7's AppImage
  # template (branch v0.4.7, also v0.4.5 and v0.4.6) renders `cookiecutter.host_arch` without declaring
  # it in its cookiecutter.json, so cookiecutter drops the value Briefcase passes and `create` stops on
  # "'collections.OrderedDict object' has no attribute 'host_arch'". The v0.4.4 template predates that
  # line; with it the AppImage builds, and it opens, answers `--check` and runs `--worker` on ubuntu
  # 22.04 and 24.04. `--no-docker` builds on the runner itself: PySide6 6.12 ships only manylinux_2_34
  # wheels, which ubuntu 22.04 (glibc 2.35) installs, so a Docker manylinux image would not make the
  # AppImage reach older systems anyway. The apt step gives linuxdeploy the libraries Qt links against,
  # so it can copy into the AppImage the ones a desktop may lack: without libxcb-cursor0 (and the three
  # xcb libraries linuxdeploy stops on before it, icccm, keysyms and shape) on the build machine, the
  # AppImage measured under Xvfb on a fresh ubuntu 22.04 aborted with "From 6.5.0, xcb-cursor0 or
  # libxcb-cursor0 is needed to load the Qt xcb platform plugin".
  #
  # Run by hand, this job is the installers' rehearsal: it builds them and uploads them as workflow
  # artifacts, and the release step below is skipped. A tag does both.
  installers:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            format: ""
            flags: ""
          - os: macos-latest
            platform: macOS
            format: ""
            flags: ""
          - os: ubuntu-22.04
            platform: linux
            format: appimage
            flags: --no-docker -C 'template_branch="v0.4.4"'
    # `write` is only used by the release step, which runs on tags alone. A job's permissions cannot depend
    # on the event, so a hand run gets it too; it uploads artifacts and nothing else.
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: What Qt links against, for linuxdeploy to find
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libgl1 libfontconfig1 libglib2.0-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0
      - run: uv run --no-project python scripts/fetch_cadmpeg.py
      - run: uvx briefcase==0.4.7 create ${{ matrix.platform }} ${{ matrix.format }} ${{ matrix.flags }} --no-input
      - run: uvx briefcase==0.4.7 build ${{ matrix.platform }} ${{ matrix.format }} ${{ matrix.flags }} --no-input
      - run: uvx briefcase==0.4.7 package ${{ matrix.platform }} ${{ matrix.format }} ${{ matrix.flags }} ${{ matrix.platform == 'macOS' && '--adhoc-sign' || '' }} --no-input
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
