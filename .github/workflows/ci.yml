name: ci
# GitHub-hosted runners only. This repository is public, so a pull request from a fork must never
# reach a machine of ours: no self-hosted runner here.
#
# The suite needs the two engines the converter drives, installed as the release publishes them and
# checked against the sha256 it publishes beside them, and the public sample from
# tangency-labs/solidcraft#2346, and the author's three public designs. Tests that need a design which
# is not public skip.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13", "3.14"]
    env:
      SOLIDCRAFT: "0.43.0"
      CADMPEG: "0.6.11"
      SAMPLE_URL: https://github.com/user-attachments/files/33617507/test.weird.box_f3d.zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Engines (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"; tmp=$(mktemp -d)
          base="cadmpeg-x86_64-unknown-linux-gnu.tar.xz"
          url="https://github.com/cadmpeg/cadmpeg/releases/download/v$CADMPEG"
          curl -fsSL -o "$tmp/$base" "$url/$base"; curl -fsSL -o "$tmp/$base.sha256" "$url/$base.sha256"
          ( cd "$tmp" && sha256sum -c "$base.sha256" )
          tar -xJf "$tmp/$base" -C "$tmp"
          find "$tmp" -name cadmpeg -type f -perm -u+x -exec install -m 755 {} "$bin/cadmpeg" \;
          tarball="solidcraft-$SOLIDCRAFT-linux-x86_64.tar.gz"
          url="https://github.com/tangency-labs/solidcraft/releases/download/v$SOLIDCRAFT"
          curl -fsSL -o "$tmp/$tarball" "$url/$tarball"; curl -fsSL -o "$tmp/SHA256SUMS.txt" "$url/SHA256SUMS.txt"
          ( cd "$tmp" && grep " $tarball\$" SHA256SUMS.txt | sha256sum -c - )
          tar -xzf "$tmp/$tarball" -C "$tmp" --strip-components=2 "solidcraft-$SOLIDCRAFT-linux-x86_64/bin/solidcraft-cli"
          install -m 755 "$tmp/solidcraft-cli" "$bin/solidcraft-cli"
          "$bin/cadmpeg" --version; "$bin/solidcraft-cli" --version

      - name: Engines (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"; tmp=$(mktemp -d)
          arch=$(uname -m); [ "$arch" = "arm64" ] && arch=aarch64
          base="cadmpeg-$arch-apple-darwin.tar.xz"
          url="https://github.com/cadmpeg/cadmpeg/releases/download/v$CADMPEG"
          curl -fsSL -o "$tmp/$base" "$url/$base"; curl -fsSL -o "$tmp/$base.sha256" "$url/$base.sha256"
          ( cd "$tmp" && shasum -a 256 -c "$base.sha256" )
          tar -xJf "$tmp/$base" -C "$tmp"
          find "$tmp" -name cadmpeg -type f -perm -u+x -exec install -m 755 {} "$bin/cadmpeg" \;
          zip="solidcraft-cli-$SOLIDCRAFT-macos-universal.zip"
          url="https://github.com/tangency-labs/solidcraft/releases/download/v$SOLIDCRAFT"
          curl -fsSL -o "$tmp/$zip" "$url/$zip"; curl -fsSL -o "$tmp/SHA256SUMS.txt" "$url/SHA256SUMS.txt"
          ( cd "$tmp" && grep " $zip\$" SHA256SUMS.txt | shasum -a 256 -c - )
          unzip -q "$tmp/$zip" -d "$tmp"
          install -m 755 "$tmp/solidcraft-cli-$SOLIDCRAFT-macos-universal/solidcraft-cli" "$bin/solidcraft-cli"
          "$bin/cadmpeg" --version; "$bin/solidcraft-cli" --version

      - name: Engines (Windows)
        if: runner.os == 'Windows'
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"; echo "$bin" >> "$GITHUB_PATH"; tmp=$(mktemp -d)
          base="cadmpeg-x86_64-pc-windows-msvc.zip"
          url="https://github.com/cadmpeg/cadmpeg/releases/download/v$CADMPEG"
          curl -fsSL -o "$tmp/$base" "$url/$base"; curl -fsSL -o "$tmp/$base.sha256" "$url/$base.sha256"
          ( cd "$tmp" && sha256sum -c "$base.sha256" )
          unzip -q "$tmp/$base" -d "$tmp/cadmpeg"
          find "$tmp/cadmpeg" -name cadmpeg.exe -exec cp {} "$bin/cadmpeg.exe" \;
          zip="solidcraft-$SOLIDCRAFT-windows-x64-portable.zip"
          url="https://github.com/tangency-labs/solidcraft/releases/download/v$SOLIDCRAFT"
          curl -fsSL -o "$tmp/$zip" "$url/$zip"; curl -fsSL -o "$tmp/SHA256SUMS.txt" "$url/SHA256SUMS.txt"
          ( cd "$tmp" && grep " $zip\$" SHA256SUMS.txt | sha256sum -c - )
          unzip -q "$tmp/$zip" -d "$tmp"
          cp "$tmp/solidcraft-$SOLIDCRAFT-windows-x64-portable/"*.exe "$bin/"
          "$bin/cadmpeg.exe" --version; "$bin/solidcraft-cli.exe" --version

      - name: Public sample
        run: |
          set -euo pipefail
          dest="$HOME/.f3d2solidcraft/corpus/samples"; mkdir -p "$dest"; tmp=$(mktemp -d)
          curl -fsSL -o "$tmp/sample.zip" "$SAMPLE_URL"
          uv run --no-project python -m zipfile -e "$tmp/sample.zip" "$tmp/out"
          cp "$tmp/out/test weird box.f3d" "$dest/test weird box.f3d"

      # The author's own designs, public as attachments on cadmpeg/cadmpeg#448 and
      # tangency-labs/solidcraft#13072, checked against the sha256 of the files the suite was measured
      # on: an attachment that changed would make the tests measure something else in silence.
      - name: Public designs
        run: |
          set -euo pipefail
          dest="$HOME/.f3d2solidcraft/corpus/propios"
          mkdir -p "$dest"
          tmp=$(mktemp -d)
          fetch() {
            curl -fsSL -o "$tmp/a.zip" "$1"
            rm -rf "$tmp/out" && uv run --no-project python -m zipfile -e "$tmp/a.zip" "$tmp/out"
            ( cd "$tmp/out" && if command -v sha256sum >/dev/null; then echo "$3 *$2" | sha256sum -c -; else echo "$3 *$2" | shasum -a 256 -c -; fi )
            install -m 644 "$tmp/out/$2" "$dest/$2"
          }
          fetch https://github.com/user-attachments/files/34251442/mango.para.lima.f3d.zip \
            "mango para lima.f3d" a90ad67beb03a377ace53baa88b24766fb022017f669eaed2a70405bd80d7284
          fetch https://github.com/user-attachments/files/34251446/Caja.parametrica.v2.f3d.zip \
            "Caja parametrica v2.f3d" 0b872bae7c16a963973a4adfd0ee32340c6789fe41fe864e40375b2bf2876246
          fetch https://github.com/user-attachments/files/34605897/soporte.controles.f3d.zip \
            "soporte controles.f3d" 06e64bd04f2a03f364475ef1910c5199bc9bb17ac183ed4d922b398c52378876

      # The window's tests need Qt: libraries the runner may lack on Linux, and the `gui-dev` group on every
      # system. Without them `tests/app/test_window.py` would skip itself green (`importorskip`), so every
      # `uv` call here names the group (a plain `uv run` syncs it away) and a step proves Qt starts.
      # Measured on bare ubuntu 22.04 and 24.04 images: with this list nothing PySide6 6.12's QtCore,
      # QtGui, QtWidgets, QtDBus and the offscreen plugin link against is missing. libegl1, libgl1 (QtGui
      # links both), libfontconfig1 (brings libfreetype6), libglib2.0-0 (QtCore), libdbus-1-3 (QtDBus,
      # QtGui), libxkbcommon0; libxkbcommon-x11-0 is for the xcb plugin, which the app uses on a desktop.
      - name: What Qt needs on a runner without a screen
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libgl1 libfontconfig1 libglib2.0-0 libdbus-1-3
      - run: uv sync --group gui-dev
      - name: Qt starts offscreen
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --group gui-dev python -c "import pytestqt; from PySide6.QtWidgets import QApplication; print('Qt', QApplication([]).platformName())"
      - run: uv run --group gui-dev ruff check
      - run: uv run --group gui-dev ruff format --check
      - name: Tests
        env:
          F3D2SC_REQUIRE_INTEGRATION: "1"
          QT_QPA_PLATFORM: offscreen
        run: uv run --group gui-dev pytest -v

  probe-windows-msi:
    runs-on: windows-latest
    steps:
      - name: Install SolidCraft from its .msi and show where solidcraft-cli.exe lands
        shell: pwsh
        run: |
          $v = "0.43.0"
          $msi = "solidcraft-$v-windows-x64.msi"
          $url = "https://github.com/tangency-labs/solidcraft/releases/download/v$v"
          Invoke-WebRequest "$url/$msi" -OutFile $msi
          Invoke-WebRequest "$url/SHA256SUMS.txt" -OutFile SHA256SUMS.txt
          $line = Get-Content SHA256SUMS.txt | Where-Object { $_ -match "\s\*?$([regex]::Escape($msi))$" } | Select-Object -First 1
          if (-not $line) { throw "$msi is not listed in SHA256SUMS.txt" }
          $expected = ($line -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 $msi).Hash
          if ($actual -ine $expected) { throw "sha256 mismatch for ${msi}: expected $expected, got $actual" }
          Write-Host "sha256 OK: $actual"
          $msiPath = (Resolve-Path $msi).Path
          $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList "/i", "`"$msiPath`"", "/qn"
          if ($p.ExitCode -ne 0) { throw "msiexec failed with exit code $($p.ExitCode)" }
          $found = Get-ChildItem -Path $env:ProgramFiles, ${env:ProgramFiles(x86)}, $env:LOCALAPPDATA -Recurse -Filter solidcraft-cli.exe -ErrorAction SilentlyContinue
          if (-not $found) { throw "solidcraft-cli.exe not found after installing $msi" }
          $found | Select-Object FullName
